<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest">
  <title>BrokCAM</title>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cc5a22"/><stop offset="1" stop-color="#b54916"/>
    </linearGradient>
    <linearGradient id="facet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2773a"/><stop offset="1" stop-color="#d2632a"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9e3f13"/><stop offset="1" stop-color="#84330e"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef0f2"/>
    </linearGradient>
  </defs>
  <!-- placa de cobre: faceta clara em diagonal e dobra escura no canto (sem clipPath, que o
       renderizador SVG do Qt não suporta: as formas já acompanham os cantos arredondados) -->
  <rect x="8" y="8" width="240" height="240" rx="46" fill="url(#base)"/>
  <path d="M21.47 234.53 A46 46 0 0 1 8 202 V54 A46 46 0 0 1 54 8 H202 A46 46 0 0 1 234.53 21.47 Z" fill="url(#facet)"/>
  <path d="M248 156 V202 A46 46 0 0 1 202 248 H156 Z" fill="url(#fold)"/>
  <!-- sombra do B -->
  <path fill-rule="evenodd" fill="#5a2208" fill-opacity="0.28" transform="translate(4 6)"
        d="M68 48 H156 L184 76 V104 L170 120 L192 142 V180 L164 208 H68 Z M102 78 H146 L154 86 V100 L146 108 H102 Z M120 164 A20 20 0 1 0 160 164 A20 20 0 1 0 120 164 Z"/>
  <!-- B chanfrado (peça usinada); o vão de baixo é um furo metalizado -->
  <path fill-rule="evenodd" fill="url(#metal)"
        d="M68 48 H156 L184 76 V104 L170 120 L192 142 V180 L164 208 H68 Z M102 78 H146 L154 86 V100 L146 108 H102 Z M120 164 A20 20 0 1 0 160 164 A20 20 0 1 0 120 164 Z"/>
  <circle cx="140" cy="164" r="20" fill="none" stroke="#f2a466" stroke-width="7"/>
  <!-- acabamento da borda -->
  <rect x="9" y="9" width="238" height="238" rx="45" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="45.5" fill="none" stroke="#5a2208" stroke-opacity="0.35" stroke-width="1"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
